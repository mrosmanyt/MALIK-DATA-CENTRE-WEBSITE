<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Design review | Postly</title>
<link rel="icon" href="../../assets/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #f4f4f6; --card: #ffffff; --tx: #111827; --mu: #6b7280; --line: #e5e7eb; --pri: #7c5cff; --ok: #16a34a; --warn: #d97706; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0b10; --card: #15151c; --tx: #f4f4f8; --mu: #a1a1b5; --line: #2a2a36; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header img { width: 28px; height: 28px; border-radius: 8px; }
  header h1 { font-size: 1rem; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: #eef2ff; color: #4338ca; white-space: nowrap; }
  .badge.approved { background: #dcfce7; color: #166534; } .badge.changes { background: #fef3c7; color: #92400e; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 120px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .hint { color: var(--mu); font-size: .88rem; margin: 0 0 12px; }
  .page { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 18px; }
  .page .lbl { font-size: .8rem; color: var(--mu); margin: 0 0 8px 4px; font-weight: 600; }
  .shot { position: relative; cursor: crosshair; line-height: 0; }
  .shot img { width: 100%; height: auto; border-radius: 8px; display: block; }
  .pin { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pri); color: #fff; display: grid; place-items: center; font: 700 12px/1 Inter; box-shadow: 0 4px 10px rgba(0,0,0,.3); border: 2px solid #fff; }
  .pin span { transform: rotate(45deg); } .pin.new { background: #ef4444; }
  aside { position: sticky; top: 70px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; max-height: calc(100vh - 90px); overflow: auto; }
  aside h2 { font-size: .95rem; margin: 0 0 10px; }
  .cm { padding: 10px 0; border-top: 1px solid var(--line); font-size: .88rem; } .cm:first-of-type { border-top: 0; }
  .cm b { font-size: .85rem; } .cm small { color: var(--mu); } .cm p { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .cm .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--pri); color: #fff; font-size: 11px; font-weight: 700; margin-right: 4px; }
  form { display: grid; gap: 8px; margin-top: 12px; }
  input, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--tx); font: inherit; }
  textarea { resize: vertical; min-height: 70px; }
  button { font: 600 .9rem Inter, sans-serif; border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--card); color: var(--tx); cursor: pointer; }
  button.primary { background: var(--pri); border-color: var(--pri); color: #fff; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 10px; justify-content: center; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .bar button { min-width: 170px; } .bar .ok { background: var(--ok); border-color: var(--ok); color: #fff; } .bar .ch { background: var(--warn); border-color: var(--warn); color: #fff; }
  .msg { max-width: 560px; margin: 80px auto; text-align: center; padding: 0 16px; } .msg i { font-size: 2.2rem; color: var(--mu); }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; max-width: 90vw; }
  .toast.on { opacity: 1; }
  footer { text-align: center; color: var(--mu); font-size: .8rem; padding: 0 16px 100px; } footer a { color: var(--pri); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { position: static; max-height: none; } .bar button { min-width: 0; flex: 1; } }
</style>
</head>
<body>
<header><img src="../../assets/logo-96.png" alt=""><h1 id="title">Loading…</h1><span class="badge" id="status" hidden></span></header>
<div id="app"></div>
<footer>Made with <a href="../" target="_blank" rel="noopener">Postly Design Studio</a>: free thumbnails, ads and social posts.</footer>
<div class="toast" id="toast"></div>
<script src="../cloud-config.js?v=1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="review.js?v=1.0"></script>
</body>
</html>
